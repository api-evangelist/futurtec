description: 'Futurtec (鑫君特) is a Chinese medical-device company founded in 2015 and recognized as a
  national high-tech enterprise, focused on orthopedic surgical robotics. Its flagship ORTHBOT surgical
  system combines navigation with automatic robotic execution — intelligent needle placement, non-invasive
  positioning, dual-camera navigation, and visual force-feedback pressure protection — and holds Chinese
  regulatory approval (Feb 2021) and EU MDR CE certification (May 2023). The company reports 251+ patents
  filed or granted, including 84+ invention patents and 25+ PCT applications. As of this enrichment pass,
  Futurtec publishes no public API, SDK, developer portal, or software surface: it is a clinical hardware
  manufacturer, so the enrichment pipeline found no API artifacts to harvest.'
